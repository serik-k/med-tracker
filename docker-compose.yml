version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medtracker-backend
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - medtracker-data:/app/db

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medtracker-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  medtracker-data:

